name: Check
on: [push, pull_request]
jobs:
  base:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: promonix
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/promonix
      SHOPIFY_API_KEY: ci-placeholder
      SHOPIFY_API_SECRET: ci-placeholder
      SHOPIFY_APP_URL: https://example.com
      SCOPES: read_products,write_discounts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm db:migrate
      - run: pnpm typecheck && pnpm test && pnpm build
      - run: npm install -g @shopify/cli@5.0.1
      - run: pnpm function:test
